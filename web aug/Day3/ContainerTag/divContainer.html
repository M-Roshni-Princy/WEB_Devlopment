<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIV Container</title>
</head>
<body>
  <!--Div container is also known as a block-level element(tag) it takes up the full width  -->
  <div style="background-color: blueviolet;width:200px;">
    <h2>Books</h2>
    <p>This is a Box of Books</p>
    <button>Buy Now</button>
  </div>

  <div style="background-color:orange;">
    <h2>Fruits</h2>
    <p>This is a Box of Fruits</p>
    <button>Add to Cart</button>
  </div>
  <!--Span tag is an inline-level element(tag) it only takes up as much width as its content// or it will only take required amount of width size as per content -->
  <p style="background-color: lightgray;">Good evening,how,are you?</p>
  <p>Good <span style="background-color: yellow;">Morning</span>,Howdy?</p>
</body>
</html>
