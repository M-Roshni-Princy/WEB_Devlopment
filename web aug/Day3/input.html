<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Fields</title>
</head>
<body>
  <label>username</label>
  <input placeholder="Enter your name"><br><br>
  <label>Email</label>
  <input type="email" placeholder="Enter your email"><br><br>
  <label>Password</label>
  <input type="password" placeholder="*****"><br><br>
  <label>Date</label>
  <input type="date"><br><br>
  <label>Mobile No</label>
  <input type="tel" placeholder="Enter your mobile number"><br><br>
  <label>Resume/File</label>
  <input type="file"><br><br>
  <label>Age/Price</label>
  <input type="number" placeholder="Enter your age/price"><br><br>
  <label>Color</label>
  <input type="color"><br><br>
  <!--type means the type of input field ,ex: text, email, password, date-->   
  <!-- two time break tag is for first it break the line than second one is for skip one line-->
</html>
