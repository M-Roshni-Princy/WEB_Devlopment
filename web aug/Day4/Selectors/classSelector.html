<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>classSelector</title>

  <style>
    .abc {
      color: red;
      background-color: yellow;
    }
  </style>
</head>
<body>
  <h2 class="abc">This is a heading</h2>

  <p class="abc">This is a paragraph.</p>

  <button class="abc">Login</button>

  <h2> this is a second heading</h2>
</body>
</html>
