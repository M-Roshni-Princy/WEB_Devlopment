<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #div1 h2 {
      color: red;
    }
    #div2 h2 {
      color: blue;
    }
  </style>
</head>
<body>
  <div id="div1">

  </div>

  <div id="div2">
    <h2>This is a heading inside a div</h2>
    <button>Click me</button>
  </div>
  <h2>This is a heading outside the div</h2>
</body>
</html>
