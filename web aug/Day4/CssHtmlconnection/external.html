<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>External CSS</title>
  <link rel="stylesheet" href="style.css">

</head>

  <div>
    <p>Hello guys how are you?</p>
  </div>
  <button>Click me</button>
</body>
</html>
